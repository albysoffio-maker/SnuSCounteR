name: SnusCounter

options:
  bundleIdPrefix: com.alby
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  SnusCounter:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Snus Counter
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.alby.snuscounter
            CFBundleURLSchemes:
              - snuscounter
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alby.snuscounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alby.snuscounter
    dependencies:
      - target: SnusWidget

  SnusWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Snus Counter
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alby.snuscounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alby.snuscounter.widget
